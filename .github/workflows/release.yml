name: Release
# When main contains a plugin version that has no tag yet, tag it and publish a GitHub Release.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check for existing tag
        id: tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.tag.outputs.exists == 'false'
        run: npm test
      - name: Publish release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
