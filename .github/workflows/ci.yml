name: CI
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Manifests are valid JSON and the version looks right
        run: |
          node -e "
            const p = require('./plugin/.claude-plugin/plugin.json');
            require('./.claude-plugin/marketplace.json');
            require('./plugin/hooks/hooks.json');
            if (!/^\d+\.\d+\.\d+$/.test(p.version)) { console.error('plugin.json version must be X.Y.Z, got ' + p.version); process.exit(1); }
          "
